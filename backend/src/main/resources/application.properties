spring.application.name=sample-agents-and-dragons

# --- Bedrock + Spring AI ---------------------------------------------------
# Override at runtime, e.g.:
#   AWS_REGION=us-east-1 SPRING_AI_BEDROCK_CONVERSE_CHAT_OPTIONS_MODEL=anthropic.claude-sonnet-4-6 mvn spring-boot:run
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:eu.anthropic.claude-sonnet-4-6}
spring.ai.bedrock.converse.chat.options.temperature=0.7

# --- Server / observability -----------------------------------------------
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
logging.level.com.witcherish=DEBUG
logging.level.org.springframework.ai=INFO
# Bedrock SDK error responses include the model id, validation reason, and request id —
# usually the missing piece when an agent silently fails inside an orchestrator's
# specialist tool. Bump to DEBUG only on errors so normal runs aren't noisy.
logging.level.software.amazon.awssdk.services.bedrockruntime=INFO
logging.level.software.amazon.awssdk.request=DEBUG
