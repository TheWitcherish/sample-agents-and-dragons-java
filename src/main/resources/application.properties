spring.application.name=sample-agents-and-dragons

# --- Bedrock + Spring AI ---------------------------------------------------
# Override at runtime, e.g.:
#   AWS_REGION=us-east-1 SPRING_AI_BEDROCK_CONVERSE_CHAT_OPTIONS_MODEL=anthropic.claude-sonnet-4-6 mvn spring-boot:run
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-6}
spring.ai.bedrock.converse.chat.options.temperature=0.7

# --- Server / observability -----------------------------------------------
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
logging.level.com.witcherish=DEBUG
logging.level.org.springframework.ai=INFO
